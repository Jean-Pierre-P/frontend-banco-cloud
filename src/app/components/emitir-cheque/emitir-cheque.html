<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Emitir Nuevo Cheque</h4>
          <button type="button" (click)="volver()" class="btn btn-sm btn-light">Volver al Dashboard</button>
        </div>
        
        <div class="card-body p-4">
          <div class="mb-3">
            <label class="form-label fw-bold">Beneficiario</label>
            <input type="text" class="form-control" [(ngModel)]="beneficiario" placeholder="Nombre completo o empresa">
          </div>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Monto ($)</label>
              <input type="number" class="form-control" [(ngModel)]="monto" placeholder="Ej: 50000" min="1" max="99999999">
            </div>
            <div class="col-md-6 mb-4">
              <label class="form-label fw-bold">Fecha de Emisión</label>
              <input type="date" class="form-control" [(ngModel)]="fechaEmision">
            </div>
          </div>
          
          <div class="d-grid gap-2">
            <button type="button" (click)="registrarCheque()" class="btn btn-success btn-lg">Registrar Emisión</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
